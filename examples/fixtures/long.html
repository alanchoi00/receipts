<h1>Data retention</h1>
<p>Request logs are kept for 30 days in hot storage, where they can be searched from the dashboard, and are then moved to cold storage for a further 335 days, after which they are permanently deleted unless a legal hold has been placed on the account by the compliance team.</p>
</main></body></html>
