name: Bug report
description: A quote wasn't found, a link or screenshot is wrong, or something crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. For security problems, please use the private report link instead."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The prompt you gave Claude, or the snap.mjs command. Include the URL and the quote.
      placeholder: |
        node skills/citing-sources-with-excerpts/scripts/snap.mjs "https://example.com/page" --quote "the text"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Script output
      description: The JSON the script printed, if you have it. Screenshots welcome.
      render: json
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Claude Code version
      placeholder: macOS 26, Node 24.2, Claude Code 2.1.319
